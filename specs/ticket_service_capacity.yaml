# Capacity expansion (handoff §6, and the whole of Act III).
#
# Things are slow. Stand up another one.
#
# THE SUBJECT IS AN APPLIANCE KIND, not a person -- the first ticket type in
# the game that is not about somebody. It is raised by the world when a
# service runs out of headroom, which happens because the player onboarded the
# users that filled it. Nobody did this to them.
#
# Provisioning one instance by hand costs forty in-game minutes, which fits in
# a day exactly once. At four thousand users, it does not fit at all. That is
# the Act II -> Act III pressure, and it is the same shape as the Act I -> II
# one: the technique does not stop working, it stops fitting.
ticket: service.capacity
subject: service
sla_minutes: 960          # two working days: buying hardware is not an hour's work
weight: 0
description: "The {subject} service is running out of room. Users are complaining that it is slow."
doc: "Add capacity to a service that has outgrown what is installed."

acceptance:
  - id: has_headroom
    check: capacity
    appliance: "{subject}"
    max_pct: 85
    doc: "Every appliance of this kind, taken together, is at or below 85% of nominal capacity."
