# Veridian Post — mail.
#
# Mailboxes and aliases. The ordering trap of handoff §8.2 lives here: an
# alias references a mailbox, so a script that creates the alias first fails
# loudly instead of leaving an alias pointing at nothing.
id: veridian_post
model: Veridian Post
vendor: veridian
kind: mail
interfaces: [web, api]
capacity: 600
credential_days: 0
doc: "Mail. One mailbox per account, plus whatever aliases the department has talked itself into."

state:
  mailboxes:
    key: [login]
    scope: service       # identity, not storage; see spec.h
    reuse_key: no          # mail is not reassigned; see spec.h
    fields: [login, address, quota_mb, status]
  aliases:
    key: [alias]
    fields: [alias, login]

endpoints:
  - id: list_mailboxes
    op: list
    collection: mailboxes
    latency_ms: 200
    doc: "Every mailbox."
    examples:
      - "api.call {inst} list_mailboxes"

  - id: get_mailbox
    op: get
    collection: mailboxes
    fields: [login]
    required: [login]
    latency_ms: 150
    doc: "One mailbox by login."
    examples:
      - "api.call {inst} get_mailbox login={login}"

  - id: create_mailbox
    op: create
    collection: mailboxes
    fields: [login, address, quota_mb, status]
    required: [login, address]
    idempotent_on: [login]
    latency_ms: 450
    failure_modes: [timeout_after_commit]
    doc: "Create a mailbox. Creating one that exists returns the existing one."
    examples:
      - "api.call {inst} create_mailbox login={newlogin} address={newlogin}@harbrook.example quota_mb=2048 status=active"

  - id: delete_mailbox
    op: delete
    collection: mailboxes
    fields: [login]
    required: [login]
    latency_ms: 350
    doc: "Remove a mailbox. The address is not released."
    examples:
      - "api.call {inst} delete_mailbox login={newlogin}"

  - id: list_aliases
    op: list
    collection: aliases
    filter: login
    latency_ms: 150
    doc: "Aliases, or one account's aliases."
    examples:
      - "api.call {inst} list_aliases"

  - id: add_alias
    op: create
    collection: aliases
    fields: [alias, login]
    required: [alias, login]
    idempotent_on: [alias]
    references: { login: mailboxes }
    latency_ms: 300
    doc: "Point an alias at a mailbox. The mailbox must already exist."
    examples:
      - "api.call {inst} add_alias alias={login}.alias login={login}"

forms:
  - id: mailbox_new
    title: "New mailbox"
    calls: create_mailbox
    fields: [login, address, quota_mb, status]
  - id: alias_new
    title: "New alias"
    calls: add_alias
    fields: [alias, login]
