# Veridian Ledger DX — the directory of record.
#
# The first appliance in the game, and the one every other appliance ends up
# referring to. Onboarding a user starts here: an account, a department group,
# and a membership joining the two. Getting that order wrong is the point
# (handoff §8.2) -- add_member references accounts and groups, so a script
# that adds the membership first fails loudly rather than leaving a half-made
# person behind.
#
# ACCESS LIVES HERE TOO, and it is modelled the way every directory models it:
# people are not given applications, GROUPS are, and people are given groups.
# Two people with the same job get the same access because they are in the
# same group, and the day the finance system needs a new permission you change
# one entitlement rather than four hundred accounts. That indirection is the
# entire reason directories exist, and a game about running one that skipped
# it would be teaching the wrong shape.
id: veridian_dx
model: Veridian Ledger DX
vendor: veridian
kind: directory
interfaces: [web, api]
capacity: 600              # users served at nominal; past this, latency climbs (§5)
credential_days: 0         # the directory authenticates the operator, not a service account
doc: "The directory of record. Accounts, groups, memberships and application access for the whole org."

state:
  accounts:
    key: [login]
    index: user_ref        # what acceptance checks ask by; see spec.h
    scope: service         # identity, not storage; see spec.h
    reuse_key: no          # a login is never free again; see spec.h
    fields:
      - login
      - { name: user_ref, type: ref, of: users }
      - display_name
      - { name: dept, type: ref, of: departments }
      - { name: status, type: enum, values: [active, suspended, contractor, leaver] }

  groups:
    replicated: yes      # the org's, not this box's; see spec.h
    key: [name]
    fields:
      - name
      - { name: kind, type: enum, values: [department, role, access] }
      - { name: dept, type: ref, of: departments }
      - description

  memberships:
    key: [login, group]
    fields:
      - { name: login, type: ref, of: accounts }
      - { name: group, type: ref, of: groups }

  apps:
    replicated: yes      # the estate's application catalogue, same on every server
    key: [name]
    fields:
      - name
      - description

  entitlements:
    replicated: yes      # who-may-use-what is policy, not storage
    key: [group, app]
    fields:
      - { name: group, type: ref, of: groups }
      - { name: app, type: ref, of: apps }
      - { name: access, type: enum, values: [read, write, admin] }

endpoints:
  - id: list_accounts
    op: list
    collection: accounts
    filter: dept
    latency_ms: 180
    doc: "Every account, or every account in one department."
    examples:
      - "api.call {inst} list_accounts"
      - "api.call {inst} list_accounts dept=engineering"

  - id: get_account
    op: get
    collection: accounts
    fields: [login]
    required: [login]
    latency_ms: 120
    doc: "One account by login. 404 if there is no such account."
    examples:
      - "api.call {inst} get_account login={login}"

  - id: create_account
    op: create
    collection: accounts
    fields: [login, user_ref, display_name, dept, status]
    required: [login, user_ref, display_name, dept]
    idempotent_on: [login]
    latency_ms: 400
    failure_modes: [timeout_after_commit]
    doc: "Create an account. The login must be unique across every account the directory has ever held, including departed ones."
    examples:
      - "api.call {inst} create_account login={newlogin} user_ref={user} display_name=Test dept=engineering status=active"

  - id: update_account
    op: update
    collection: accounts
    fields: [login, display_name, dept, status]
    required: [login]
    latency_ms: 300
    doc: "Change an account's department, display name or status."
    examples:
      - "api.call {inst} update_account login={login} status=active"

  - id: delete_account
    op: delete
    collection: accounts
    fields: [login]
    required: [login]
    latency_ms: 300
    doc: "Remove an account. The login is not released; it stays spent."
    examples:
      - "api.call {inst} delete_account login={newlogin}"

  - id: list_groups
    op: list
    collection: groups
    filter: kind
    latency_ms: 120
    doc: "Every group the directory knows, or every group of one kind."
    examples:
      - "api.call {inst} list_groups"
      - "api.call {inst} list_groups kind=access"

  - id: create_group
    op: create
    collection: groups
    fields: [name, kind, dept, description]
    required: [name]
    idempotent_on: [name]
    latency_ms: 300
    doc: "Create a group. Creating one that exists is not an error."
    examples:
      - "api.call {inst} create_group name=role-oncall kind=role description=\"Carries the pager\""

  - id: delete_group
    op: delete
    collection: groups
    fields: [name]
    required: [name]
    latency_ms: 260
    doc: "Remove a group. Its memberships and entitlements are not tidied up for you."
    examples:
      - "api.call {inst} delete_group name=role-oncall"

  - id: list_members
    op: list
    collection: memberships
    filter: group
    latency_ms: 150
    doc: "Memberships, or the members of one group."
    examples:
      - "api.call {inst} list_members"
      - "api.call {inst} list_members group=dept-engineering"

  - id: add_member
    op: create
    collection: memberships
    fields: [login, group]
    required: [login, group]
    idempotent_on: [login, group]
    references: { login: accounts, group: groups }
    latency_ms: 350
    failure_modes: [timeout_after_commit]
    doc: "Put an account in a group. Both must already exist."
    examples:
      - "api.call {inst} add_member login={login} group=dept-engineering"

  - id: remove_member
    op: delete
    collection: memberships
    fields: [login, group]
    required: [login, group]
    latency_ms: 300
    doc: "Take an account out of a group."
    examples:
      - "api.call {inst} remove_member login={login} group=dept-engineering"

  - id: list_apps
    op: list
    collection: apps
    latency_ms: 120
    doc: "The application catalogue: everything access can be granted to."
    examples:
      - "api.call {inst} list_apps"

  - id: create_app
    op: create
    collection: apps
    fields: [name, description]
    required: [name]
    idempotent_on: [name]
    latency_ms: 280
    doc: "Register an application so access to it can be granted."
    examples:
      - "api.call {inst} create_app name=expenses description=\"Expense claims\""

  - id: list_entitlements
    op: list
    collection: entitlements
    filter: group
    latency_ms: 160
    doc: "Which groups may use which applications."
    examples:
      - "api.call {inst} list_entitlements"
      - "api.call {inst} list_entitlements group=dept-finance"

  - id: grant_app
    op: create
    collection: entitlements
    fields: [group, app, access]
    required: [group, app]
    idempotent_on: [group, app]
    references: { group: groups, app: apps }
    latency_ms: 320
    doc: "Let a group use an application. GROUPS get applications; people get groups."
    examples:
      - "api.call {inst} grant_app group=dept-finance app=ledger access=write"

  - id: revoke_app
    op: delete
    collection: entitlements
    fields: [group, app]
    required: [group, app]
    latency_ms: 300
    doc: "Take an application away from a group."
    examples:
      - "api.call {inst} revoke_app group=dept-finance app=ledger"

forms:
  - id: account_new
    title: "New account"
    calls: create_account
    fields: [login, user_ref, display_name, dept, status]
  - id: account_edit
    title: "Edit account"
    calls: update_account
    fields: [login, display_name, dept, status]
  - id: group_new
    title: "New group"
    calls: create_group
    fields: [name, kind, dept, description]
  - id: member_add
    title: "Add to group"
    calls: add_member
    fields: [login, group]
  - id: member_remove
    title: "Remove from group"
    calls: remove_member
    fields: [login, group]
  - id: app_new
    title: "Register application"
    calls: create_app
    fields: [name, description]
  - id: app_grant
    title: "Give a group an app"
    calls: grant_app
    fields: [group, app, access]
  - id: app_revoke
    title: "Take an app away"
    calls: revoke_app
    fields: [group, app]
